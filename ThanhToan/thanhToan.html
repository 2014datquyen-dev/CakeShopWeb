<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
        
</head>
<body>
    <div class="container">
        <!-- ===== BỔ SUNG RESPONSIVE: Tiêu đề riêng cho màn hình <= 1024px ===== -->
        <header class="mobile-header">
            <h1>Freshcake.vn</h1>
        </header>
        <!-- ===== KẾT THÚC BỔ SUNG ===== -->
        <div class="left">
            <h1>Freshcake.vn</h1>
            <h3>Thông tin giao hàng</h3>
            <p>Bạn đã có tài khoản? <a href="../DangKiDangNhap/DangNhap.html">Đăng nhập</a><p>
            <input class="ho-ten" type="text" placeholder="Họ và tên">    
            <div class="form-row">
                <input  class="email" type="text" placeholder="Email">            
                <input class="call" type="text" placeholder="Số điện thoại">
            </div>
                <input type="text" placeholder="Địa chỉ">
            <div class="address-row"> 
                <select id="province" required>
                    <option value=""> Tỉnh / Thành phố</option>
                </select>
                <select id="ward" required>
                    <option value="">Phường / Xã</option>
                </select>
            </div>

            <div class="payment-container">
                <h3>Phương thức thanh toán</h3>
                <div class="payment-methods">
                    <label class="payment-card">
                        <input type="radio" name="payment-method" value="COD" checked>
                        <span class="method-name">Thanh toán khi nhận hàng</span>
                    </label>
                    <label class="payment-card">
                        <input type="radio" name="payment-method" valud="Vietcombank">
                        <span class="payment-name">Vietcombank</span>
                    </label>
                </div>
            </div>

            <div class="actions">
                <a href="../GioHang/gioHang.html">Giỏ hàng</a>
                <button style="font-size: 25px;">Thanh toán</button>
            </div>
            <footer>
                <hr>
                <p>Powered by Haravan</p>
            </footer>
        </div>
        <div class="right">
            <!-- ===== BỔ SUNG RESPONSIVE: Nút mở/đóng đơn hàng ===== -->
            <button class="order-toggle" id="orderToggle" type="button"
                    aria-expanded="false" aria-controls="orderDetails">
                <span class="toggle-label">
                    <img src="../images/icons/cart2.png"></img>
                    <span class="toggle-text"></span>
                    <span class="toggle-arrow"></span>
                </span>
                <span class="toggle-price">1,180,000₫</span>
            </button>
            <!-- ===== KẾT THÚC BỔ SUNG ===== -->
            <!-- ===== BỔ SUNG RESPONSIVE: Nhóm chi tiết để ẩn/hiện ===== -->
            <div class="order-details" id="orderDetails">
                <div class="product-list">
                    <div class="product">
                        <img src="../abc.png">
                        <div class="product-info">
                            <p>Bánh kem Hương mật</p>
                            <small>Size 4 inch - 10 cm</small>
                        </div>

                        <span class="price">800,000₫</span>

                    </div>
                    <div class="product">
                        <img src="../abc.png">
                        <div class="product-info">
                            <p>Bánh kem Cara cà phê</p>
                            <small>8 inch - 21 cm</small>
                        </div>
                        <span class="price">380,000₫</span>
                    </div>
                </div>
            </div>
            <!-- ===== KẾT THÚC BỔ SUNG ===== -->
            <!-- MÃ GIẢM GIÁ -->
            <div class="discount">

                <input type="text"
                       placeholder="Mã giảm giá">

                <button type="button">
                    Sử dụng
                </button>

            </div>


            <!-- TÍNH TIỀN -->
            <div class="summary">

                <div class="summary-row">
                    <span>Tạm tính</span>
                    <span>1,180,000₫</span>
                </div>

                <div class="summary-row">
                    <span>Phí vận chuyển</span>
                    <span>Miễn phí</span>
                </div>

            </div>


            <!-- TỔNG CỘNG -->
            <div class="total">

                <span>Tổng cộng</span>

                <div class="total-price">
                    <small>VND</small>
                    <strong>1,180,000₫</strong>
                </div>

            </div>

        </div>
    </div>
    <!-- ===== BỔ SUNG RESPONSIVE: Tương tác mở/đóng đơn hàng ===== -->
    <script src="script.js"></script>
    <!-- ===== KẾT THÚC BỔ SUNG ===== -->
</body>
</html>
